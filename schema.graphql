  getGame(id: ID!): Game_prueba_whatsapp
  listGames(limit: Int, nextToken: String): GameConnection
  getBet(id: ID!): Bet_prueba_whatsapp
  listBets(filter: TableBetFilterInput, limit: Int, nextToken: String): BetConnection
  getConversation(id: ID!): Conversation_prueba_whatsapp
  listConversations(filter: TableConversationFilterInput, limit: Int, nextToken: String): ConversationConnection
  getConfig(id: ID!): Config_prueba_whatsapp
  listWebhookCaptures(limit: Int, nextToken: String): WebhookCaptureConnection
}

type Mutation {
  createSession(input: CreateSession_prueba_whatsappInput!): Session_prueba_whatsapp
  updateSession(input: UpdateSession_prueba_whatsappInput!): Session_prueba_whatsapp
  deleteSession(input: DeleteInput!): Session_prueba_whatsapp
  createGame(input: CreateGame_prueba_whatsappInput!): Game_prueba_whatsapp
  createBet(input: CreateBet_prueba_whatsappInput!): Bet_prueba_whatsapp
  createConversation(input: CreateConversation_prueba_whatsappInput!): Conversation_prueba_whatsapp
  updateConversation(input: UpdateConversation_prueba_whatsappInput!): Conversation_prueba_whatsapp
  deleteConversation(input: DeleteInput!): Conversation_prueba_whatsapp
  createConfig(input: CreateConfig_prueba_whatsappInput!): Config_prueba_whatsapp
  updateConfig(input: UpdateConfig_prueba_whatsappInput!): Config_prueba_whatsapp
  createWebhookCapture(input: CreateWebhookCapture_prueba_whatsappInput!): WebhookCapture_prueba_whatsapp
}

type Subscription {
