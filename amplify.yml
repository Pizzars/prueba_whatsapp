version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          # Skip build if only docs/, .kiro/, or .md files changed
          git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qvE '^(docs/|\.kiro/|.*\.md$)' || {
            echo "Only docs changed, skipping build."
            exit 1
          }
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
